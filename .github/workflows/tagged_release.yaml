name: Build prebuilds and publish

on:
  workflow_dispatch:
  push:
    branches:
      - master
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  prebuild:
    name: prebuild (${{ matrix.platform }}-${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            platform: win32
            arch: x64
            opencv: "4.1.1"
          - os: ubuntu-22.04
            platform: linux
            arch: x64
            opencv: apt
    env:
      ELECTRON_TARGET: 25.9.8
      OPENCV_DIR: C:\opencv\opencv\build
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 18

      # ------------------------------------------------------------ Windows
      - name: Cache OpenCV (Windows)
        if: runner.os == 'Windows'
        id: opencv-cache
        uses: actions/cache@v4
        with:
          path: C:\opencv
          key: opencv-${{ matrix.opencv }}-vc14_vc15

      - name: Install OpenCV (Windows)
        if: runner.os == 'Windows' && steps.opencv-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $version = "${{ matrix.opencv }}"
          $installer = Join-Path $env:RUNNER_TEMP "opencv-$version.exe"
          curl.exe -L --fail --retry 3 -o "$installer" `
            "https://github.com/opencv/opencv/releases/download/$version/opencv-$version-vc14_vc15.exe"
          Start-Process -FilePath "$installer" -ArgumentList '-o"C:\opencv"', '-y' -Wait
          Get-ChildItem "$env:OPENCV_DIR\x64\*\lib" -Filter "opencv_world*.lib" |
            Select-Object FullName

      # -------------------------------------------------------------- Linux
      - name: Install OpenCV (Linux)
        if: runner.os == 'Linux'
        run: |
          # The runner's default azure.archive.ubuntu.com mirror is very slow
          # and can serve a stale package index; use the upstream archive.
          sudo sed -i -E 's#https?://[a-z0-9.]*archive\.ubuntu\.com/ubuntu#http://archive.ubuntu.com/ubuntu#g' \
            /etc/apt/sources.list /etc/apt/apt-mirrors.txt 2>/dev/null || true
          sudo apt-get update -o Acquire::Retries=5
          sudo apt-get install -y --no-install-recommends --fix-missing libopencv-dev
          pkg-config --modversion opencv4
          pkg-config --variable=libdir opencv4

      # ------------------------------------------------------------- build
      - name: Install build dependencies
        run: |
          npm install -g node-gyp
          npm ci --ignore-scripts --unsafe-perm

      - name: Build Electron prebuild
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IS_TAG: ${{ github.ref_type == 'tag' }}
        run: node scripts/prebuild-electron.js

      - name: List prebuild artifacts
        shell: bash
        run: |
          ls -la build/Release
          ls -la prebuilds || true

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: prebuild-${{ matrix.platform }}-${{ matrix.arch }}-${{ matrix.opencv }}
          if-no-files-found: error
          path: |
            build/Release/*
            prebuilds/*.tar.gz

  publish-npm:
    name: publish to npm
    needs: prebuild
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 18
          registry-url: https://registry.npmjs.org

      - name: Publish
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
