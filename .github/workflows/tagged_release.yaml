name: Prebuild Windows x64 (Electron)

on:
  workflow_dispatch:
  push:
    branches:
      - master
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  prebuild-win:
    runs-on: windows-2022
    env:
      OPENCV_VERSION: 4.1.1
      ELECTRON_TARGET: 25.9.8
      OPENCV_DIR: C:\opencv\opencv\build
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Cache OpenCV
        id: opencv-cache
        uses: actions/cache@v4
        with:
          path: C:\opencv
          key: opencv-${{ env.OPENCV_VERSION }}-vc14_vc15

      - name: Install OpenCV ${{ env.OPENCV_VERSION }}
        if: steps.opencv-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $installer = Join-Path $env:RUNNER_TEMP "opencv-$env:OPENCV_VERSION.exe"
          curl.exe -L --fail --retry 3 -o "$installer" `
            "https://github.com/opencv/opencv/releases/download/$env:OPENCV_VERSION/opencv-$env:OPENCV_VERSION-vc14_vc15.exe"
          Start-Process -FilePath "$installer" -ArgumentList '-o"C:\opencv"', '-y' -Wait

      - name: Verify OpenCV
        shell: pwsh
        run: |
          Get-ChildItem "$env:OPENCV_DIR\x64" -Directory | Select-Object FullName
          Get-ChildItem "$env:OPENCV_DIR\x64\*\lib" -Filter "opencv_world*.lib" | Select-Object FullName

      - name: Install dependencies
        run: |
          npm install -g node-gyp
          npm ci --ignore-scripts --unsafe-perm
          # the lockfile pins prebuild@11/node-abi@2 which predate Electron 25
          npm install --no-save --package-lock=false prebuild@13.0.1 nan@^2.20.0

      - name: Build Electron prebuild
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IS_TAG: ${{ github.ref_type == 'tag' }}
        run: node scripts/prebuild-electron.js

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: opencv4nodejs-prebuilt-electron-v116-win32-x64
          if-no-files-found: error
          path: |
            build/Release/*.node
            build/Release/*.dll
            prebuilds/*.tar.gz
